name: Daily scrape

on:
  schedule:
    # 04:00 Europe/Paris = 03:00 UTC en hiver, 02:00 UTC en été.
    # On lance à 02:30 UTC pour couvrir les deux cas.
    - cron: '30 2 * * *'
  workflow_dispatch:  # permet de lancer manuellement depuis l'onglet Actions

# Permissions explicites pour que l'Action puisse commit
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Run events scraper
        run: python scripts/scraper_events.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.json events.json; then
            echo "Aucun changement, rien à committer."
          else
            git add data.json events.json
            git commit -m "chore(data): scrape $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
